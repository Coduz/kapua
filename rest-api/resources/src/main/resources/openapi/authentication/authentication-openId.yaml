openapi: 3.0.3

info:
  title: Eclipse Kapua REST API - Authentication
  version: '1.0'
  contact:
    name: Eclipse Kapua Dev Team
    url: https://eclipse.org/kapua
    email: kapua-dev@eclipse.org
  license:
    name: Eclipse Public License 2.0
    url: https://www.eclipse.org/legal/epl-2.0

paths:
  /authentication/openId:
    post:
      tags:
        - Authentication
      summary: Login - OpenId
      operationId: authenticationOpenId
      requestBody:
        content:
          application/json:
            schema:
              $ref: './authentication.yaml#/components/schemas/openIdCredentials'
      responses:
        200:
          description: The new AccessToken
          content:
            application/json:
              schema:
                $ref: './authentication.yaml#/components/schemas/accessToken'
        400:
          $ref: '../openapi.yaml#/components/responses/illegalArgument'
        401:
          $ref: '../openapi.yaml#/components/responses/unauthenticated'
        500:
          $ref: '../openapi.yaml#/components/responses/kapuaError'
      security: []
